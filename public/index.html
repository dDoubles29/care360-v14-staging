<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARE360 V1.4 Synthetic Intake — Staging</title><style>body{font:16px system-ui;max-width:600px;margin:40px auto;padding:20px;color:#213e50}label{display:block;margin-top:14px}input,select,button{padding:10px;font:inherit}input,select{width:100%;box-sizing:border-box}button{margin-top:18px;background:#214764;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;background:#edf3f5;padding:14px}</style><h1>CARE360 V1.4 Synthetic Intake — Staging</h1><p>Development only. No names, emails, HLI responses or bookings.</p><label>Preferred date<input id="date" type="date"></label><label>Preferred period<select id="period"><option value="morning">Morning</option><option value="afternoon">Afternoon</option></select></label><div class="cf-turnstile" data-sitekey="REPLACE_WITH_DEV_TURNSTILE_SITE_KEY" data-callback="onVerified"></div><button id="submit" disabled>Submit one fictional visit request</button><pre id="output">Complete verification first.</pre><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script>let token='';let requestId=crypto.randomUUID();window.onVerified=t=>{token=t;document.getElementById('submit').disabled=false};document.getElementById('submit').onclick=async()=>{const b=document.getElementById('submit');b.disabled=true;const out=document.getElementById('output');out.textContent='Submitting...';try{const r=await fetch('/api/care360/visit-intake-synthetic',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_request_id:requestId,preferred_date:document.getElementById('date').value,preferred_period:document.getElementById('period').value,turnstile_token:token})});out.textContent=JSON.stringify({http_status:r.status,...await r.json()},null,2)}catch(e){out.textContent='Network error. Do not retry until the database is checked.'}};</script></html>
